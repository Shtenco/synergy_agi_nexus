name: ARC3 Official Public Probe

on:
  push:
    branches:
      - arc3-official-public-probe-20260824
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official ARC toolkit
        run: python -m pip install --upgrade pip && python -m pip install 'arc-agi==0.9.9'
      - name: Run official public access probe
        run: python arc3_probe/probe.py
      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-official-probe-result
          path: arc3_probe_result.json
