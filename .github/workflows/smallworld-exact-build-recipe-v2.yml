name: NEXUS SmallWorld Exact Build Recipe v2

on:
  pull_request:
    paths:
      - 'config/smallworld_exact_build_recipe_v2.json'
      - 'src/agi_nexus/service_build_recipe_v2.py'
      - 'schemas/nexus_service_build_recipe_v2.schema.json'
      - 'schemas/nexus_service_build_artifact_v2.schema.json'
      - 'tests/test_service_build_recipe_v2.py'
      - 'docs/SMALLWORLD_EXACT_BUILD_RECIPE_V2.md'
      - '.github/workflows/smallworld-exact-build-recipe-v2.yml'
  workflow_dispatch:

concurrency:
  group: nexus-smallworld-exact-build-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_smallworld_exact_v2.py tests/test_service_build_recipe_v2.py
