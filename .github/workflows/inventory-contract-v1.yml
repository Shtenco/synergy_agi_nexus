name: NEXUS Inventory Contract v1

on:
  pull_request:
    paths:
      - "config/**"
      - "src/agi_nexus/**"
      - "tests/**"
      - "docs/MIGRATION_POLICY_V1.md"
      - ".github/workflows/inventory-contract-v1.yml"
  push:
    paths:
      - "config/**"
      - "src/agi_nexus/**"
      - "tests/**"
      - "docs/MIGRATION_POLICY_V1.md"
      - ".github/workflows/inventory-contract-v1.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: python -m pytest -q
      - run: python -m py_compile src/agi_nexus/*.py
