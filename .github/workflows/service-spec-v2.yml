name: NEXUS Service Spec v2

on:
  pull_request:
    paths:
      - 'config/service_spec_v2.json'
      - 'src/agi_nexus/service_spec_v2.py'
      - 'tests/test_service_spec_v2.py'
      - 'docs/SERVICE_SPEC_V2.md'
      - '.github/workflows/service-spec-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q tests/test_minimal_nexus_core_v3.py tests/test_service_spec_v2.py
