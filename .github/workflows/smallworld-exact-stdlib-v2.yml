name: NEXUS SmallWorld Exact Stdlib v2

on:
  pull_request:
    paths:
      - 'src/agi_nexus/smallworld_exact_v2.py'
      - 'src/agi_nexus/compute_service_v2.py'
      - 'config/smallworld_compute_service_v2.json'
      - 'schemas/nexus_compute_request_v2.schema.json'
      - 'schemas/nexus_compute_response_v2.schema.json'
      - 'fixtures/smallworld_exact_v2/canonical_8node_response.json'
      - 'tests/test_smallworld_exact_v2.py'
      - 'docs/SMALLWORLD_EXACT_STDLIB_V2.md'
      - '.github/workflows/smallworld-exact-stdlib-v2.yml'
  workflow_dispatch:

concurrency:
  group: nexus-smallworld-exact-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-stdlib:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_smallworld_exact_v2.py
