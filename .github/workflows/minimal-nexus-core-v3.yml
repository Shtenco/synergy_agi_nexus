name: Minimal NEXUS Core v3

on:
  pull_request:
    paths:
      - 'src/agi_nexus/r710/**'
      - 'src/agi_nexus/cyber_state_v1.py'
      - 'src/agi_nexus/smallworld_core_v2.py'
      - 'src/agi_nexus/nexus_core_v2.py'
      - 'src/agi_nexus/nexus_service_v3.py'
      - 'config/r710_migration_provenance_v1.json'
      - 'config/nexus_runtime_source_v3.json'
      - 'tests/test_minimal_nexus_core_v3.py'
      - 'docs/MINIMAL_NEXUS_CORE_V3.md'
      - '.github/workflows/minimal-nexus-core-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q tests/test_minimal_nexus_core_v3.py
